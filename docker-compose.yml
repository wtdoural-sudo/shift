version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenderops
      POSTGRES_PASSWORD: tenderops
      POSTGRES_DB: tenderops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderops -d tenderops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
